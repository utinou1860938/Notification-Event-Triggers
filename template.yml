AWSTemplateFormatVersion: "2010-09-09"
Description: Notification Event Triggers POC

Parameters:
  DomainName:
    Type: String
    Description: SES で使用するドメイン名
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 ホストゾーン ID
  SesRegion:
    Type: String
    Description: SES を利用するリージョン
    Default: ap-northeast-1
  SmsSenderIdValue:
    Description: SMS 送信元 ID
    Type: String
    Default: NOTIFY-POC

Resources:
  # SNS
  NotificationEventTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: notification-event-topic

  NotificationEventTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotificationEventTopic
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationEventTopic
#          - Effect: Allow
#            Principal:
#              Service: sms-voice.amazonaws.com
#            Action: sns:Publish
#            Resource: !Ref NotificationEventTopic

  # SES
  SesEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      MailFromAttributes:
        MailFromDomain: !Sub "mail.${DomainName}"

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue1

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue2

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue3

  # SPF レコード
  # v=spf1: SPF バージョン 1 を宣言
  # include:amazonses.com: Amazon SES のメールサーバーからの送信を正当なものとして許可
  # ~all: 上記以外のサーバーからの送信はソフトフェイル（受信側が迷惑メール扱いにする可能性がある）
  SesSpfRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "mail.${DomainName}"
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

  # MX レコード（カスタム MAIL FROM に必須）
  # 10: 優先度（数値が小さいほど優先）
  # feedback-smtp.{region}.amazonses.com: SES がバウンス・苦情の返信メールを受け取るためのエンドポイント
  # カスタム MAIL FROM を設定すると、受信側がバウンスを返す宛先がこのドメインになるため、
  # SES がそれを受信できるよう MX レコードで指定する必要がある
  SesMailFromMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "mail.${DomainName}"
      Type: MX
      TTL: "300"
      ResourceRecords:
        - !Sub "10 feedback-smtp.${SesRegion}.amazonses.com"

  # DMARC レコード
  # v=DMARC1: DMARC バージョン 1 を宣言
  # p=none: ポリシー。認証失敗時のアクション（none=何もしない/監視のみ, quarantine=隔離, reject=拒否）
  # 本番では p=reject への段階的移行を推奨
  SesDmarcRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_dmarc.${DomainName}"
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - '"v=DMARC1; p=none;"'

  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: notification-event-config

  SesEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: notification-event-destination
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
          - delivery
        SnsDestination:
          TopicARN: !Ref NotificationEventTopic

  # EUM (SMS)
  SmsSenderId:
    Type: AWS::SMSVOICE::SenderId
    Properties:
      SenderId: !Ref SmsSenderIdValue
      IsoCountryCode: JP

  SmsConfigurationSet:
    Type: AWS::SMSVOICE::ConfigurationSet
    Properties:
      ConfigurationSetName: sms-event-config
      DefaultSenderId: !Ref SmsSenderIdValue

#  SmsEventDestination:
#    Type: AWS::PinpointSMSVoiceV2::EventDestination
#    Properties:
#      ConfigurationSetName: !Ref SmsConfigurationSet
#      EventDestinationName: sms-event-destination
#      Enabled: true
#      MatchingEventTypes:
#        - ALL
#      SnsDestination:
#        TopicArn: !Ref NotificationEventTopic

  # SQS
  NotificationEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notification-event-queue
      MessageRetentionPeriod: 1209600  # 14 days

  # SNS -> SQS Subscription
  NotificationEventSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationEventTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationEventQueue.Arn
      RawMessageDelivery: true

  # SQS Policy (SNS からの送信を許可)
  NotificationEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationEventQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationEventQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref NotificationEventTopic
