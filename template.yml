AWSTemplateFormatVersion: "2010-09-09"
Description: Notification Event Triggers POC

Parameters:
  DomainName:
    Type: String
    Description: SES で使用するドメイン名
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 ホストゾーン ID

Resources:
  # SNS
  NotificationEventTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: notification-event-topic

  NotificationEventTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotificationEventTopic
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationEventTopic

  # SES
  SesEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue1

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue2

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue3

  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: notification-event-config

  SesEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: notification-event-destination
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
          - delivery
        SnsDestination:
          TopicARN: !Ref NotificationEventTopic

  # SQS
  NotificationEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notification-event-queue
      MessageRetentionPeriod: 1209600  # 14 days

  # SNS -> SQS Subscription
  NotificationEventSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationEventTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationEventQueue.Arn
      RawMessageDelivery: true

  # SQS Policy (SNS からの送信を許可)
  NotificationEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationEventQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationEventQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref NotificationEventTopic
